<section class="container">
  <h1>Cart & Checkout</h1>

  <p class="message" aria-live="polite">{{ message }}</p>

  <div *ngIf="items.length === 0" class="empty">
    <p>Your cart is empty.</p>
    <a routerLink="/">Browse carbon credits</a>
  </div>

  <div *ngIf="items.length">
    <article class="cart-row" *ngFor="let item of items">
      <div>
        <h2>{{ item.credit.projectName }}</h2>
        <p>₹{{ item.credit.price }} per credit</p>
      </div>

      <div>
        <label [for]="'cart-' + item.credit.id">Quantity</label>
        <input
          [id]="'cart-' + item.credit.id"
          type="number"
          min="1"
          [max]="item.credit.availableCredits"
          [ngModel]="item.quantity"
          (ngModelChange)="change(item, $event)">
      </div>

      <strong>₹{{ item.credit.price * item.quantity }}</strong>

      <button class="danger" type="button" (click)="remove(item.credit.id)">
        Remove
      </button>
    </article>

    <div class="total">
      <h2>Total: ₹{{ cart.total() }}</h2>
      <p>Total credits: {{ cart.credits() }}</p>

      <button type="button" (click)="checkout=true">
        Proceed to Checkout
      </button>
    </div>
  </div>

  <form *ngIf="checkout && items.length" class="form-card" (ngSubmit)="placeOrder()">
    <h2>Checkout</h2>

    <label for="name">Full Name</label>
    <input id="name" name="name" [(ngModel)]="form.name" required>

    <label for="email">Email</label>
    <input id="email" type="email" name="email" [(ngModel)]="form.email" required>

    <label for="phone">Phone</label>
    <input id="phone" type="tel" name="phone" [(ngModel)]="form.phone" required>

    <label for="address">Address</label>
    <textarea id="address" name="address" [(ngModel)]="form.address" required></textarea>

    <label for="city">City</label>
    <input id="city" name="city" [(ngModel)]="form.city" required>

    <label for="state">State</label>
    <input id="state" name="state" [(ngModel)]="form.state" required>

    <label for="pin">PIN Code</label>
    <input id="pin" name="pin" inputmode="numeric" maxlength="6" [(ngModel)]="form.pin" required>

    <button type="submit">Place Order</button>
  </form>
</section>
